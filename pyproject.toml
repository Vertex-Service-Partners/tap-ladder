[project]
name = "tap-ladder"
version = "0.1.0"
description = "Singer tap for the Ladder Data API (in-home sales conversations), built with the Meltano Singer SDK."
authors = [ { name = "Vertex Service Partners", email = "data@vertexservicepartners.com" } ]
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
keywords = ["ELT", "Ladder"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "singer-sdk~=0.54.9",
    "requests~=2.32.3",
    "typing-extensions>=4.5; python_version < '3.12'",
]

[project.optional-dependencies]
s3 = [ "s3fs" ]

[project.scripts]
tap-ladder = "tap_ladder.tap:TapLadder.cli"

[dependency-groups]
dev = [
    { include-group = "test" },
]
test = [
    "pytest>=8",
    "singer-sdk[testing]",
]

[tool.hatch.build.targets.sdist]
include = [ "tap_ladder" ]

[tool.hatch.build.targets.wheel]
include = [ "tap_ladder" ]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
src = ["tap_ladder"]
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "COM812", # missing-trailing-comma
    "ISC001", # single-line-implicit-string-concatenation
    "FIX",    # allow TODO comments
    "ERA",    # allow commented-out code
    "CPY",    # no per-file copyright headers
]
select = [ "ALL" ]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "S101",    # asserts in pytest functions is OK
    "D103",    # test docstrings optional
    "PLR2004", # magic values in asserts are fine
    "SLF001",  # tests poke at private attributes
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.isort]
known-first-party = [ "tap_ladder" ]

[tool.ruff.lint.pydocstyle]
convention = "google"
